name: Run Delta Crypto Bot

concurrency:
  group: delta-trading-bot
  cancel-in-progress: true

on:
  schedule:
    # This triggers the bot to boot up and run every hour automatically
     - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:     # Allows you to click a button to start it manually anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy pandas requests

      - name: Execute Trading Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u bot.py
